  gl.uniform3fv(pTile.u.uRed, C_RED); gl.uniform3fv(pTile.u.uEdge, C_EDGE);
  gl.uniform1i(pTile.u.uPass, 0); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, T);
  gl.uniform1i(pTile.u.uPass, 1); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, T);
  gl.bindVertexArray(null);
}

/* ============================================================
   Captions, controls, loop
   ============================================================ */
const cap = document.getElementById('cap'), sbtn = document.getElementById('snd');
let capKey = null, capOverride = null, capTimer = 0;
function setCapText(s) {
  cap.textContent = '';
  if (s.endsWith('.')) { cap.append(s.slice(0, -1)); const d = document.createElement('i'); d.className = 'dot'; cap.append(d); }
  else cap.append(s);
}
function updateCaption() {
  let s = COPY.labels[0][1]; for (const [t0, l] of COPY.labels) if (filmT >= t0) s = l;
  if (capOverride) s = capOverride;
  if (s === capKey) return;
  capKey = s; cap.classList.add('out'); clearTimeout(capTimer);
  capTimer = setTimeout(() => { setCapText(s); cap.classList.remove('out'); measureKnock(); }, 380);
  knock.b0 = knock.b1 = .5;                       // let the ring close while the caption swaps
}
function measureKnock() {
  const fr = film.getBoundingClientRect(); if (!fr.width) return;
  if (!cap.classList.contains('out') && cap.textContent) {
    const r = cap.getBoundingClientRect(); knock.b0 = (r.left - fr.left) / fr.width - .004; knock.b1 = (r.right - fr.left) / fr.width + .004;
  }
  if (film.classList.contains('ui') || document.activeElement === sbtn) {
    const r = sbtn.getBoundingClientRect(); knock.t0 = (r.left - fr.left) / fr.width - .004; knock.t1 = (r.right - fr.left) / fr.width + .004;
  } else knock.t0 = knock.t1 = 2;
}

let playing = true, last = performance.now(), uiTimer = 0;
function showUI() { film.classList.add('ui'); measureKnock(); clearTimeout(uiTimer); uiTimer = setTimeout(() => { film.classList.remove('ui'); measureKnock(); }, 2600); }
function setPlaying(p) {
  playing = p; capOverride = p ? null : COPY.pause; last = performance.now();
  if (p && snd.on && snd.ctx) snd.ctx.resume();
}
async function toggleSound() {
  if (!snd.ctx && !sndInit()) return;
  snd.on = !snd.on;
  if (snd.on) await snd.ctx.resume(); else snd.ctx.suspend();
  sbtn.textContent = snd.on ? COPY.off : COPY.on; sbtn.setAttribute('aria-pressed', String(snd.on));
  requestAnimationFrame(measureKnock);
}
sbtn.textContent = COPY.on;
sbtn.addEventListener('click', e => { e.stopPropagation(); toggleSound(); showUI(); });
film.addEventListener('click', () => { setPlaying(!playing); showUI(); });
film.addEventListener('pointermove', showUI);
document.addEventListener('keydown', e => {
  if (e.target === sbtn && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); setPlaying(!playing); showUI(); }
  else if (e.key === 'm') toggleSound();
  else if (e.key === 'r') { firstRun = true; resetState(false); filmT = 0; setPlaying(true); }
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(film);

/* start */
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const startAt = parseFloat(params.get('t'));
if (Number.isFinite(startAt)) seek(startAt);
else if (reduce) { seek(76.5); playing = false; capOverride = COPY.play; }
else { resetState(false); filmT = 0; }
if (params.has('paused')) { playing = false; }
resize();
window.__film = { seek: t => { seek(t); render(); }, get t() { return filmT; }, pause: () => setPlaying(false) };

function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (playing && !document.hidden) advance(dt);
  flushSound(dt);
  updateCaption();
  render();
  requestAnimationFrame(frame);
}
updateCaption();
requestAnimationFrame(frame);
})();
</script>
</body>
